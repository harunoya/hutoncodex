[package]
name = "hutoncodex"
version = "0.1.0"
description = "A Tauri client for Codex App Server"
authors = ["hutoncodex contributors"]
edition = "2021"

[lib]
name = "hutoncodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3.31"
http = "1.4.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.49", features = ["io-util", "net", "process", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "1.1.0"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
