[workspace]
resolver = "2"
members = [
  "crates/remote-protocol",
  "crates/session-core",
  "crates/app-server-client",
  "services/gateway",
  "services/host-agent",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.4"
rand = "0.8"
remote-protocol = { path = "crates/remote-protocol" }
session-core = { path = "crates/session-core" }
app-server-client = { path = "crates/app-server-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
